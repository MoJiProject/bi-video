geo $deny_ip {
    default 0;
}

map "R$http_referer" $referer_trusted {
    default                                                          0;
    "~^R$"                                                           1;
    "~*Rhttps?://([a-z0-9-]+\.)*mojivideo\.online([:/?#]|$)"        1;
    "~*Rhttps?://[^/]*(baidu|bing|google|sogou|so|sm|duckduckgo|quark|weixin)\." 1;
}

map $status $static_cache_control {
    200     "public, max-age=2592000";
    206     "public, max-age=2592000";
    304     "public, max-age=2592000";
    default "no-store, no-cache, must-revalidate";
}

map $status $media_cache_control {
    200     "public, max-age=7776000";
    206     "public, max-age=7776000";
    304     "public, max-age=7776000";
    default "no-store, no-cache, must-revalidate";
}

server {
    listen 443 ssl http2;
    server_name mojivideo.online;

    ssl_certificate     C:/Users/Administrator/Desktop/bilibili/ssl/mojivideo.online.pem;
    ssl_certificate_key C:/Users/Administrator/Desktop/bilibili/ssl/mojivideo.online.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256:AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;

    return 301 https://www.mojivideo.online$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.mojivideo.online;

    ssl_certificate     C:/Users/Administrator/Desktop/bilibili/ssl/mojivideo.online.pem;
    ssl_certificate_key C:/Users/Administrator/Desktop/bilibili/ssl/mojivideo.online.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256:AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;

    client_max_body_size 50m;
    root C:/Users/Administrator/Desktop/bilibili/dist;
    index index.html;

    add_header Cache-Control "no-cache" always;

    if ($http_user_agent ~* "(python|scrapy|curl|wget|spider|bot|crawler|httpclient)") {
        return 403;
    }

    if ($deny_ip) {
        return 403;
    }

    location / {
        limit_req zone=cc burst=100 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpe?g|gif|webp|avif|apng|bmp|svg|ico|woff2?|ttf|eot|otf)$ {
        client_max_body_size 10m;
        try_files $uri =404;
        add_header Cache-Control $static_cache_control always;
        access_log off;
    }

    location ~* \.(js|css|woff2?|ttf|eot)$ {
        try_files $uri =404;
        add_header Cache-Control $static_cache_control always;
        access_log off;
    }

    location ~* \.(mp4|webm|ogg|mov)$ {
        client_max_body_size 50m;
        try_files $uri =404;
        if ($referer_trusted = 0) {
            return 403;
        }
        add_header Cache-Control $media_cache_control always;
        access_log off;
    }

    location /upload/ {
        limit_req zone=cc burst=100 nodelay;
        try_files $uri =404;
        add_header Cache-Control $static_cache_control always;
    }

    location ^~ /api/ {
        limit_req zone=cc burst=100 nodelay;

        if ($http_user_agent = "") {
            return 403;
        }

        proxy_pass http://localhost:8081/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }
}

server {
    listen 80;
    server_name www.mojivideo.online mojivideo.online;

    return 301 https://www.mojivideo.online$request_uri;
}
