# 定义 IP 限速区域
limit_req_zone $binary_remote_addr zone=cc:10m rate=10r/s;

# 定义 IP 黑名单
geo $deny_ip {
    default 0;
}

server {
    listen 443 ssl http2;
    server_name mojivideo.xyz www.mojivideo.xyz;

    ssl_certificate     C:/Users/Administrator/Desktop/bilibili/ssl/mojivideo.xyz.pem;
    ssl_certificate_key C:/Users/Administrator/Desktop/bilibili/ssl/mojivideo.xyz.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 默认上传最大 50MB
    client_max_body_size 50m;

    root C:/Users/Administrator/Desktop/bilibili/dist;
    index index.html;

    # ============================
    # 防爬虫（UA 黑名单）
    # ============================
    if ($http_user_agent ~* "(python|scrapy|curl|wget|spider|bot|crawler|httpclient)") {
        return 403;
    }

    # 黑名单 IP 拦截
    if ($deny_ip) {
        return 403;
    }

    # ============================
    # 前端路由
    # ============================
    location / {
        limit_req zone=cc burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # ============================
    # 图片资源（最大 10MB + 防盗链）
    # ============================
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        client_max_body_size 10m;

        # 兼容 phpstudy 的防盗链写法
        if ($http_referer !~* "(mojivideo\.xyz|www\.mojivideo\.xyz|^$)") {
            return 403;
        }

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ============================
    # 字体/JS/CSS
    # ============================
    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ============================
    # 视频资源（最大 50MB + 防盗链）
    # ============================
    location ~* \.(mp4|webm|ogg|mov)$ {
        client_max_body_size 50m;

        # 兼容 phpstudy 的防盗链写法
        if ($http_referer !~* "(mojivideo\.xyz|www\.mojivideo\.xyz|^$)") {
            return 403;
        }

        expires 3650d;
        add_header Cache-Control "public, max-age=7776000";
        access_log off;
    }

    # ============================
    # API 防爬虫 + 限速
    # ============================
    location /api/ {
        limit_req zone=cc burst=10 nodelay;

        # 禁止无 UA（90% 是爬虫）
        if ($http_user_agent = "") {
            return 403;
        }

        proxy_pass http://localhost:8081/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control no-cache;
        expires 12h;
    }
}

# ============================
# HTTP 自动跳 HTTPS
# ============================
server {
    listen 80;
    server_name www.mojivideo.xyz mojivideo.xyz;

    return 301 https://mojivideo.xyz$request_uri;
}
