geo $deny_ip {
    default 0;
}

server {
    listen 443 ssl http2;
    server_name mojivideo.xyz www.mojivideo.xyz;

    ssl_certificate     C:/Users/Administrator/Desktop/bilibili/ssl/mojivideo.xyz.pem;
    ssl_certificate_key C:/Users/Administrator/Desktop/bilibili/ssl/mojivideo.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES128-GCM-SHA256:AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;

    client_max_body_size 50m;
    root C:/Users/Administrator/Desktop/bilibili/dist;
    index index.html;

    if ($http_user_agent ~* "(python|scrapy|curl|wget|spider|bot|crawler|httpclient)") {
        return 403;
    }

    if ($deny_ip) {
        return 403;
    }

    location / {
        limit_req zone=cc burst=100 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        client_max_body_size 10m;
        if ($http_referer !~* "(mojivideo\.xyz|www\.mojivideo\.xyz|^$)") {
            return 403;
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~* \.(js|css|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~* \.(mp4|webm|ogg|mov)$ {
        client_max_body_size 50m;
        if ($http_referer !~* "(mojivideo\.xyz|www\.mojivideo\.xyz|^$)") {
            return 403;
        }
        expires 3650d;
        add_header Cache-Control "public, max-age=7776000";
        access_log off;
    }

location ^~ /api/ {
    limit_req zone=cc burst=100 nodelay;

    if ($http_user_agent = "") {
        return 403;
    }

    proxy_pass http://localhost:8081/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";

    proxy_connect_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 确保 Cache-Control 在所有响应中都能生效
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
}

}

server {
    listen 80;
    server_name www.mojivideo.xyz mojivideo.xyz;

    return 301 https://mojivideo.xyz$request_uri;
}