# 本地开发环境配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/bi_video?useSSL=false&serverTimezone=UTC
    username:
    password:
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0

file:
  upload:
    # 上传根目录，所有子目录在其下自动创建
    root:
    # 以下为各子目录路径，不配置时自动取 root 下的对应子目录
    comment-img:
    avatar:
    video-cover:
    video:
    message-img:
    collect-classify:
    background:
    dynamic:
