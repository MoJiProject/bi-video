# 公共配置，环境相关配置见 application-dev.yml / application-prod.yml
# 启动时指定环境：--spring.profiles.active=prod
spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB
  main:
    allow-circular-references: true

server:
  port: 8081

api:
  crypto:
    key: bi-video-api-key-32-byte-value!!
    iv: bi-video-api-iv!

logging:
  file:
    name: logs/bi-video.log

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.moji.po

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto # 这通常适用于主键的自动生成策略，具体值根据需求调整

# 上传路径公共配置，root 由各环境自行指定
file:
  upload:
    # 磁盘剩余空间低于该值时禁止上传，支持 5GB / 5000MB / 5368709120
    safety-capacity: 5GB

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 604800
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: false
